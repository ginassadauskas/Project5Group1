[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "busplanner"
version = "0.1.0"
dependencies = [
    "numpy",
    "openpyxl",
    "pandas",
    "plotly",
    "streamlit",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["busplanner*"]
